mixinsquared = { group = "com.github.bawnorton.mixinsquared", name = "mixinsquared-fabric", version.ref = "mixinsquared" }
mod_menu = { group = "com.terraformersmc", name = "modmenu", version.ref = "mod_menu" }
#parchment = { group = "org.parchmentmc.data", name = "parchment-1.21.1", version.ref = "parchment" }
sodium = { group = "maven.modrinth", name = "sodium", version.ref = "sodium" }

[bundles]
